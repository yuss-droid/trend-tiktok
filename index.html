<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto Kita Blur - TikTok Trend</title>
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        /* Video Webcam */
        video#webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efek Cermin */
            transition: filter 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.35s ease;
        }

        /* Efek Blur GPU Halus */
        video#webcam.blurred {
            filter: blur(28px) brightness(0.85) contrast(1.1);
            transform: scaleX(-1) scale(1.08);
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 30;
            pointer-events: none;
        }

        .status-pill {
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            flex-shrink: 0;
        }

        .dot.active {
            background-color: #ec4899;
            box-shadow: 0 0 14px #ec4899;
            transform: scale(1.2);
        }

        .hint-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Lirik Teks Estetik */
        .lyrics-container {
            position: absolute;
            bottom: 22%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
            padding: 0 16px;
        }

        .lyrics-text {
            font-family: 'Georgia', 'Playfair Display', serif, cursive;
            font-style: italic;
            font-size: clamp(2rem, 7.5vw, 3.4rem);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 182, 193, 0.6);
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        .lyrics-text.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Bottom Controls Bar */
        .bottom-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 24px);
            left: 0;
            right: 0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 30;
            gap: 16px;
        }

        /* Shutter Button (TikTok Filter Style) */
        .shutter-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .shutter-inner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .shutter-btn.active {
            border-color: #ec4899;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.8);
        }

        .shutter-btn.active .shutter-inner {
            background: #ec4899;
            transform: scale(0.85);
        }

        /* Side Action Buttons */
        .side-btn {
            background: rgba(10, 15, 25, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .side-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0;
            animation: floatUp 1.6s ease-out forwards;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-140px) scale(1.3) rotate(20deg);
            }
        }
    </style>
</head>
<body>

    <div class="camera-wrapper" id="cameraWrapper">
        <!-- Video Webcam -->
        <video id="webcam" autoplay playsinline muted></video>

        <!-- Top Header Status -->
        <div class="top-bar">
            <div class="status-pill">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">Tap Layar / Tekan Tombol untuk Blur</span>
            </div>
            <div class="hint-text">💡 Tap tombol bulat di bawah atau tekan Spasi</div>
        </div>

        <!-- Floating Lyric Text Overlay -->
        <div class="lyrics-container">
            <div class="lyrics-text" id="lyricsText">foto kita blur ~</div>
        </div>

        <!-- Bottom Controls Bar (Mobile Friendly) -->
        <div class="bottom-bar">
            <!-- Tombol Ganti Kamera Depan/Belakang -->
            <button class="side-btn" id="flipCameraBtn" title="Ganti Kamera">
                🔄
            </button>

            <!-- Tombol Utama Shutter / Blur -->
            <div class="shutter-btn" id="mainShutterBtn">
                <div class="shutter-inner" id="shutterInner">✌️</div>
            </div>

            <!-- Tombol Mode AI / Gestur -->
            <button class="side-btn" id="aiModeBtn" title="AI Gestur ✌️">
                🤖
            </button>
        </div>
    </div>

    <!-- Background Audio -->
    <audio id="bgm" loop preload="auto">
        <source src="lagu.mp3.mp3" type="audio/mp4">
        <source src="lagu.mp3.mp3" type="audio/mpeg">
        <source src="lagu.mp3" type="audio/mpeg">
        <source src="lagu.m4a" type="audio/mp4">
    </audio>

    <script>
        const video = document.getElementById('webcam');
        const lyricsText = document.getElementById('lyricsText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const bgm = document.getElementById('bgm');
        const shutterBtn = document.getElementById('mainShutterBtn');
        const flipCameraBtn = document.getElementById('flipCameraBtn');
        const aiModeBtn = document.getElementById('aiModeBtn');
        const cameraWrapper = document.getElementById('cameraWrapper');

        let isBlurred = false;
        let aiModeActive = false;
        let currentFacingMode = "user";
        let currentStream = null;

        // 1. Inisialisasi Kamera Mobile
        async function startCamera(facing = "user") {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facing,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                currentStream = stream;
                video.srcObject = stream;

                if (facing === "user") {
                    video.style.transform = "scaleX(-1)";
                } else {
                    video.style.transform = "scaleX(1)";
                }
            } catch (err) {
                console.error("Camera error:", err);
                statusText.innerText = "Izinkan akses kamera di browser";
                statusDot.style.backgroundColor = "#ef4444";
            }
        }

        // 2. Fungsi On/Off Blur & Musik yang Bersih (Tanpa Looping)
        function toggleBlur() {
            setBlurState(!isBlurred);
        }

        function setBlurState(active) {
            if (isBlurred === active) return;
            isBlurred = active;

            if (active) {
                video.classList.add('blurred');
                lyricsText.classList.add('show');
                statusDot.classList.add('active');
                statusText.innerText = "✨ Foto Kita Blur (Aktif)";
                shutterBtn.classList.add('active');

                // Putar Lagu
                bgm.play().catch(() => {});
                createHearts();
            } else {
                video.classList.remove('blurred');
                lyricsText.classList.remove('show');
                statusDot.classList.remove('active');
                statusText.innerText = "Tap Layar / Tekan Tombol untuk Blur";
                shutterBtn.classList.remove('active');

                // Hentikan Lagu
                bgm.pause();
                bgm.currentTime = 0;
            }
        }

        function createHearts() {
            if (!isBlurred) return;
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const emojis = ['🌸', '✨', '💖', '✌️', '💫'];
            heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = (Math.random() * 70 + 15) + '%';
            heart.style.bottom = '30%';
            cameraWrapper.appendChild(heart);
            setTimeout(() => heart.remove(), 1600);
        }

        // 3. Tombol Shutter & Tap Layar (100% Responsif & Stabil)
        shutterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleBlur();
        });

        // Tap di area layar kamera
        cameraWrapper.addEventListener('click', (e) => {
            if (e.target === cameraWrapper || e.target === video) {
                toggleBlur();
            }
        });

        // Keyboard Spasi (Laptop)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleBlur();
            }
        });

        // Ganti Kamera Depan / Belakang
        flipCameraBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera(currentFacingMode);
        });

        // 4. Mode AI Deteksi Gestur (Opsional)
        aiModeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            aiModeActive = !aiModeActive;
            if (aiModeActive) {
                aiModeBtn.style.borderColor = "#ec4899";
                statusText.innerText = "Mode AI Aktif • Angkat Pose ✌️";
                initMediaPipe();
            } else {
                aiModeBtn.style.borderColor = "rgba(255,255,255,0.2)";
                statusText.innerText = "Mode Tap Aktif";
                setBlurState(false);
            }
        });

        let hands = null;
        function initMediaPipe() {
            if (typeof Hands === 'undefined') {
                alert("MediaPipe sedang dimuat, gunakan tombol Tap/Spasi sementara!");
                return;
            }

            if (!hands) {
                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((results) => {
                    if (!aiModeActive) return;
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const lm = results.multiHandLandmarks[0];
                        // Deteksi pose Peace ✌️
                        const isPeace = (lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y);
                        if (isPeace) {
                            setBlurState(true);
                            return;
                        }
                    }
                    setBlurState(false);
                });

                const camera = new Camera(video, {
                    onFrame: async () => {
                        if (aiModeActive) {
                            await hands.send({ image: video });
                        }
                    },
                    width: 480,
                    height: 360
                });
                camera.start();
            }
        }

        // Jalankan kamera saat pertama buka
        startCamera("user");
    </script>
</body>
</html>
