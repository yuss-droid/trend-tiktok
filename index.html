<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto Kita Blur - TikTok Trend</title>
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Mobile viewport height fix */
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        /* Video Webcam */
        video#webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Cermin */
            transition: filter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.3s ease;
        }

        /* Efek Blur GPU 60-120 FPS */
        video#webcam.blurred {
            filter: blur(25px) brightness(0.85) contrast(1.1);
            transform: scaleX(-1) scale(1.08);
        }

        /* Top Bar Info */
        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 30;
            pointer-events: none;
        }

        .status-pill {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 92%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            flex-shrink: 0;
        }

        .dot.active {
            background-color: #ec4899;
            box-shadow: 0 0 12px #ec4899;
        }

        .hint-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.65);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Overlay Lirik Teks Estetik */
        .lyrics-container {
            position: absolute;
            bottom: 22%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
            padding: 0 16px;
        }

        .lyrics-text {
            font-family: 'Georgia', 'Playfair Display', serif, cursive;
            font-style: italic;
            font-size: clamp(1.8rem, 7vw, 3.2rem);
            color: #ffffff;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 182, 193, 0.6);
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        .lyrics-text.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Bottom Controls (TikTok / IG Reels Style) */
        .bottom-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 20px);
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 30;
            gap: 12px;
        }

        /* Shutter Trigger Button (Paling Besar di Tengah) */
        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .shutter-inner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .shutter-btn.active {
            border-color: #ec4899;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.8);
        }

        .shutter-btn.active .shutter-inner {
            background: #ec4899;
            transform: scale(0.85);
        }

        /* Side Action Buttons */
        .side-btn {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .side-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0;
            animation: floatUp 1.6s ease-out forwards;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-140px) scale(1.3) rotate(20deg);
            }
        }
    </style>
</head>
<body>

    <div class="camera-wrapper" id="cameraWrapper">
        <!-- Live Camera Feed -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hiddenCanvas" style="display:none;" width="160" height="120"></canvas>

        <!-- Top Header Status -->
        <div class="top-bar">
            <div class="status-pill">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">Kamera Siap • Pose ✌️ atau Tekan Tombol</span>
            </div>
            <div class="hint-text">💡 Tap layar / tombol bulat di bawah untuk On/Off</div>
        </div>

        <!-- Floating Lyric Text Overlay -->
        <div class="lyrics-container">
            <div class="lyrics-text" id="lyricsText">foto kita blur ~</div>
        </div>

        <!-- Bottom Controls Bar (Mobile Friendly) -->
        <div class="bottom-bar">
            <!-- Tombol Ganti Kamera Depan/Belakang -->
            <button class="side-btn" id="flipCameraBtn" title="Ganti Kamera">
                🔄
            </button>

            <!-- Tombol Utama Shutter / Blur -->
            <div class="shutter-btn" id="mainShutterBtn">
                <div class="shutter-inner" id="shutterInner">✌️</div>
            </div>

            <!-- Tombol Musik On/Off -->
            <button class="side-btn" id="musicToggleBtn" title="Audio">
                🎵
            </button>
        </div>
    </div>

    <!-- Background Audio -->
    <audio id="bgm" loop preload="auto">
        <source src="lagu.mp3.mp3" type="audio/mp4">
        <source src="lagu.mp3.mp3" type="audio/mpeg">
        <source src="lagu.mp3" type="audio/mpeg">
        <source src="lagu.m4a" type="audio/mp4">
    </audio>

    <script>
        const video = document.getElementById('webcam');
        const lyricsText = document.getElementById('lyricsText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const bgm = document.getElementById('bgm');
        const shutterBtn = document.getElementById('mainShutterBtn');
        const flipCameraBtn = document.getElementById('flipCameraBtn');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const cameraWrapper = document.getElementById('cameraWrapper');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        let isBlurred = false;
        let isManualActive = false;
        let currentFacingMode = "user"; // Depan (user) atau Belakang (environment)
        let currentStream = null;

        // 1. Inisialisasi Kamera Mobile Responsive
        async function startCamera(facing = "user") {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facing,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                currentStream = stream;
                video.srcObject = stream;

                // Atur cermin sesuai kamera depan/belakang
                if (facing === "user") {
                    video.style.transform = "scaleX(-1)";
                } else {
                    video.style.transform = "scaleX(1)";
                }

                startInstantGestureDetector();
                initMediaPipe();
            } catch (err) {
                console.error("Camera error:", err);
                statusText.innerText = "Izinkan akses kamera di browser";
                statusDot.style.backgroundColor = "#ef4444";
            }
        }

        // 2. Kontrol Efek Blur & Musik
        function setBlurState(active) {
            if (isBlurred === active) return;
            isBlurred = active;

            if (active) {
                video.classList.add('blurred');
                lyricsText.classList.add('show');
                statusDot.classList.add('active');
                statusText.innerText = "✨ Foto Kita Blur (Aktif)";
                shutterBtn.classList.add('active');

                // Putar Lagu
                bgm.play().catch(() => {});
                createHearts();
            } else {
                video.classList.remove('blurred');
                lyricsText.classList.remove('show');
                statusDot.classList.remove('active');
                statusText.innerText = "Kamera Siap • Pose ✌️ atau Tekan Tombol";
                shutterBtn.classList.remove('active');

                // Hentikan Lagu
                bgm.pause();
                bgm.currentTime = 0;
            }
        }

        function createHearts() {
            if (!isBlurred) return;
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const emojis = ['🌸', '✨', '💖', '✌️', '💫'];
            heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = (Math.random() * 70 + 15) + '%';
            heart.style.bottom = '30%';
            cameraWrapper.appendChild(heart);
            setTimeout(() => heart.remove(), 1600);
        }

        // 3. Detektor Gestur Instan (Super Cepat di HP)
        function startInstantGestureDetector() {
            setInterval(() => {
                if (isManualActive || !video.videoWidth) return;

                ctx.drawImage(video, 0, 0, 160, 120);
                const frame = ctx.getImageData(0, 0, 160, 120);
                const data = frame.data;
                
                let topHalfSkin = 0;
                for (let i = 0; i < data.length; i += 16) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (r > 65 && g > 45 && b > 25 && r > g && r > b && (r - g) > 10) {
                        const pixelIndex = i / 4;
                        const y = Math.floor(pixelIndex / 160);
                        if (y < 60) topHalfSkin++;
                    }
                }

                if (topHalfSkin > 75) {
                    setBlurState(true);
                } else {
                    setBlurState(false);
                }
            }, 70);
        }

        // 4. MediaPipe Hands (Deteksi Jari ✌️)
        function initMediaPipe() {
            if (typeof Hands === 'undefined') return;

            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.35,
                    minTrackingConfidence: 0.35
                });

                hands.onResults((results) => {
                    if (isManualActive) return;
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const lm = results.multiHandLandmarks[0];
                        const wrist = lm[0];
                        const distIndex = Math.hypot(lm[8].x - wrist.x, lm[8].y - wrist.y);
                        const distMiddle = Math.hypot(lm[12].x - wrist.x, lm[12].y - wrist.y);

                        if (distIndex > 0.22 && distMiddle > 0.22) {
                            setBlurState(true);
                            return;
                        }
                    }
                    if (!isManualActive) setBlurState(false);
                });

                const camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 480,
                    height: 360
                });
                camera.start();
            } catch(e) {}
        }

        // 5. Interaksi Tap & Tombol
        function toggleManual() {
            isManualActive = !isManualActive;
            if (isManualActive) {
                setBlurState(true);
            } else {
                setBlurState(false);
            }
        }

        // Tombol Bulat Shutter
        shutterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleManual();
        });

        // Tap di Layar Mana Saja
        cameraWrapper.addEventListener('click', (e) => {
            if (e.target === cameraWrapper || e.target === video) {
                toggleManual();
            }
        });

        // Keyboard Spasi (Laptop)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleManual();
            }
        });

        // Ganti Kamera Depan / Belakang
        flipCameraBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera(currentFacingMode);
        });

        // Tombol Musik
        musicToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (bgm.paused) {
                bgm.play();
                musicToggleBtn.style.borderColor = "#ec4899";
            } else {
                bgm.pause();
                musicToggleBtn.style.borderColor = "rgba(255,255,255,0.2)";
            }
        });

        // Mulai kamera
        startCamera("user");
    </script>
</body>
</html>
