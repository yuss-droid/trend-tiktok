<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto Kita Blur - TikTok Trend</title>
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070c;
            overflow: hidden;
        }

        /* Video Webcam */
        video#webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Cermin */
            transition: filter 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.35s ease;
        }

        /* Efek Blur GPU 60-120 FPS */
        video#webcam.blurred {
            filter: blur(28px) brightness(0.85) contrast(1.1);
            transform: scaleX(-1) scale(1.08);
        }

        /* Top Bar Status */
        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 30;
            pointer-events: none;
        }

        .status-pill {
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #eab308; /* Kuning saat memuat */
            box-shadow: 0 0 8px #eab308;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .dot.ready {
            background-color: #22c55e; /* Hijau saat siap */
            box-shadow: 0 0 8px #22c55e;
        }

        .dot.active {
            background-color: #ec4899; /* Pink saat pose terdeteksi */
            box-shadow: 0 0 14px #ec4899;
            transform: scale(1.3);
        }

        .hint-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Lirik Teks Estetik */
        .lyrics-container {
            position: absolute;
            bottom: 22%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
            padding: 0 16px;
        }

        .lyrics-text {
            font-family: 'Georgia', 'Playfair Display', serif, cursive;
            font-style: italic;
            font-size: clamp(2rem, 7.5vw, 3.4rem);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 182, 193, 0.6);
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        .lyrics-text.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Bottom Controls Bar */
        .bottom-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 24px);
            left: 0;
            right: 0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 30;
            gap: 16px;
        }

        /* Shutter Button (Bisa diklik manual juga) */
        .shutter-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .shutter-inner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .shutter-btn.active {
            border-color: #ec4899;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.8);
        }

        .shutter-btn.active .shutter-inner {
            background: #ec4899;
            transform: scale(0.85);
        }

        /* Side Action Buttons */
        .side-btn {
            background: rgba(10, 15, 25, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .side-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0;
            animation: floatUp 1.6s ease-out forwards;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-140px) scale(1.3) rotate(20deg);
            }
        }
    </style>
</head>
<body>

    <div class="camera-wrapper" id="cameraWrapper">
        <!-- Live Webcam -->
        <video id="webcam" autoplay playsinline muted></video>

        <!-- Top Status -->
        <div class="top-bar">
            <div class="status-pill">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">Memuat AI Deteksi Pose...</span>
            </div>
            <div class="hint-text">💡 Angkat pose ✌️ ke kamera (atau tap layar)</div>
        </div>

        <!-- Floating Lyrics Text -->
        <div class="lyrics-container">
            <div class="lyrics-text" id="lyricsText">foto kita blur ~</div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <!-- Ganti Kamera Depan/Belakang -->
            <button class="side-btn" id="flipCameraBtn" title="Ganti Kamera">
                🔄
            </button>

            <!-- Shutter Button -->
            <div class="shutter-btn" id="mainShutterBtn">
                <div class="shutter-inner" id="shutterInner">✌️</div>
            </div>

            <!-- Placeholder / Sound Icon -->
            <div class="side-btn" id="soundIcon" style="opacity:0.8; pointer-events:none;">
                🎵
            </div>
        </div>
    </div>

    <!-- Background Audio -->
    <audio id="bgm" loop preload="auto">
        <source src="lagu.mp3.mp3" type="audio/mp4">
        <source src="lagu.mp3.mp3" type="audio/mpeg">
        <source src="lagu.mp3" type="audio/mpeg">
        <source src="lagu.m4a" type="audio/mp4">
    </audio>

    <script>
        const video = document.getElementById('webcam');
        const lyricsText = document.getElementById('lyricsText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const bgm = document.getElementById('bgm');
        const shutterBtn = document.getElementById('mainShutterBtn');
        const flipCameraBtn = document.getElementById('flipCameraBtn');
        const cameraWrapper = document.getElementById('cameraWrapper');

        let isBlurred = false;
        let isManualMode = false;
        let currentFacingMode = "user";
        let currentStream = null;
        let aiReady = false;

        // 1. Inisialisasi Kamera Mobile
        async function startCamera(facing = "user") {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facing,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                currentStream = stream;
                video.srcObject = stream;

                if (facing === "user") {
                    video.style.transform = "scaleX(-1)";
                } else {
                    video.style.transform = "scaleX(1)";
                }

                // Otomatis jalankan MediaPipe AI langsung sejak awal
                initMediaPipeAuto();
            } catch (err) {
                console.error("Camera error:", err);
                statusText.innerText = "Izinkan akses kamera di browser";
                statusDot.style.backgroundColor = "#ef4444";
            }
        }

        // 2. Kontrol Efek Blur & Musik
        function setBlurState(active) {
            if (isBlurred === active) return;
            isBlurred = active;

            if (active) {
                video.classList.add('blurred');
                lyricsText.classList.add('show');
                statusDot.className = "dot active";
                statusText.innerText = "✨ Foto Kita Blur (✌️ Terdeteksi)";
                shutterBtn.classList.add('active');

                // Putar Lagu
                bgm.play().catch(() => {});
                createHearts();
            } else {
                video.classList.remove('blurred');
                lyricsText.classList.remove('show');
                statusDot.className = aiReady ? "dot ready" : "dot";
                statusText.innerText = "AI Siap • Tunjukkan pose ✌️";
                shutterBtn.classList.remove('active');

                // Hentikan Lagu
                bgm.pause();
                bgm.currentTime = 0;
            }
        }

        function createHearts() {
            if (!isBlurred) return;
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const emojis = ['🌸', '✨', '💖', '✌️', '💫'];
            heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = (Math.random() * 70 + 15) + '%';
            heart.style.bottom = '30%';
            cameraWrapper.appendChild(heart);
            setTimeout(() => heart.remove(), 1600);
        }

        // 3. AI MediaPipe Otomatis Sejak Awal (Khusus Deteksi Jari ✌️)
        let hands = null;
        let camera = null;

        function initMediaPipeAuto() {
            if (typeof Hands === 'undefined') {
                setTimeout(initMediaPipeAuto, 500);
                return;
            }

            if (!hands) {
                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.45,
                    minTrackingConfidence: 0.45
                });

                hands.onResults((results) => {
                    if (!aiReady) {
                        aiReady = true;
                        statusDot.className = "dot ready";
                        statusText.innerText = "AI Siap • Tunjukkan pose ✌️";
                    }

                    if (isManualMode) return; // Jika sedang ditekan manual

                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const lm = results.multiHandLandmarks[0];
                        
                        // Cek jari telunjuk (8) & tengah (12) tegak ke atas
                        // Cek jari manis (16) & kelingking (20) tertekuk
                        const indexUp = lm[8].y < lm[6].y;
                        const middleUp = lm[12].y < lm[10].y;
                        const ringDown = lm[16].y > lm[14].y;
                        const pinkyDown = lm[20].y > lm[18].y;

                        // Pose Peace ✌️
                        if (indexUp && middleUp && ringDown && pinkyDown) {
                            setBlurState(true);
                            return;
                        }
                    }

                    // Jika tidak ada pose ✌️
                    if (!isManualMode) {
                        setBlurState(false);
                    }
                });

                camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 480,
                    height: 360
                });
                camera.start();
            }
        }

        // 4. Cadangan: Klik / Tap Manual
        function toggleManual() {
            isManualMode = true;
            setBlurState(!isBlurred);
            // Kembali ke mode AI otomatis setelah 4 detik jika ditekan manual
            setTimeout(() => { isManualMode = false; }, 4000);
        }

        shutterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleManual();
        });

        cameraWrapper.addEventListener('click', (e) => {
            // Unlock audio browser
            bgm.load();
            if (e.target === cameraWrapper || e.target === video) {
                toggleManual();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleManual();
            }
        });

        // Ganti Kamera Depan / Belakang
        flipCameraBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera(currentFacingMode);
        });

        // Jalankan langsung
        startCamera("user");
    </script>
</body>
</html>
