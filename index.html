<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Kita Blur - TikTok Trend</title>
    <!-- MediaPipe Hands CDN (Opsional untuk AI) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070c;
            overflow: hidden;
            cursor: pointer;
        }

        /* Video Webcam */
        video#webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            transition: filter 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease;
        }

        /* Efek Blur GPU 120 FPS */
        video#webcam.blurred {
            filter: blur(28px) brightness(0.88) contrast(1.1);
            transform: scaleX(-1) scale(1.05);
        }

        /* Overlay Lirik Teks Estetik */
        .lyrics-overlay {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%) translateY(30px) scale(0.95);
            font-family: 'Georgia', 'Playfair Display', serif, cursive;
            font-style: italic;
            font-size: clamp(2.2rem, 5.5vw, 3.8rem);
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 182, 193, 0.5);
            letter-spacing: 2px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            text-align: center;
            white-space: nowrap;
        }

        .lyrics-overlay.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* Header Info Badge */
        .status-badge {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 20;
            transition: all 0.3s ease;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            transition: all 0.3s;
        }

        .dot.active {
            background-color: #ec4899;
            box-shadow: 0 0 16px #ec4899;
            transform: scale(1.3);
        }

        /* Bottom Controls */
        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 14px;
            z-index: 20;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #fff;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .btn-action.active {
            background: #ec4899;
            border-color: #f472b6;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
        }

        /* Floating aesthetic hearts */
        .heart {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0;
            animation: floatUp 1.8s ease-out forwards;
            pointer-events: none;
            z-index: 15;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.6) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-130px) scale(1.4) rotate(25deg);
            }
        }

        /* Touch / Trigger Hint */
        .tap-hint {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            pointer-events: none;
            text-align: center;
            z-index: 18;
        }
    </style>
</head>
<body>

    <div class="camera-container" id="cameraView">
        <!-- Live Webcam -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hiddenCanvas" style="display:none;" width="160" height="120"></canvas>

        <!-- Status Badge -->
        <div class="status-badge" id="statusBadge">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Kamera Aktif • Angkat Pose ✌️ atau Tekan Spasi</span>
        </div>

        <div class="tap-hint">💡 Klik layar / tekan Spasi kapan saja untuk langsung ON/OFF</div>

        <!-- Floating Lyric Text -->
        <div class="lyrics-overlay" id="lyrics">foto kita blur ~</div>

        <!-- Bottom Controls -->
        <div class="controls">
            <button class="btn-action" id="toggleBlurBtn">
                <span>✌️</span> <span id="btnText">Tombol Blur (Spasi)</span>
            </button>
            <button class="btn-action" id="modeBtn">
                <span id="modeIcon">⚡</span> <span id="modeText">Mode: Sensitif ✌️</span>
            </button>
        </div>
    </div>

    <!-- Background Audio -->
    <audio id="bgm" loop preload="auto">
        <source src="lagu.mp3.mp3" type="audio/mp4">
        <source src="lagu.mp3.mp3" type="audio/mpeg">
        <source src="lagu.mp3" type="audio/mpeg">
        <source src="lagu.m4a" type="audio/mp4">
    </audio>

    <script>
        const video = document.getElementById('webcam');
        const lyrics = document.getElementById('lyrics');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const bgm = document.getElementById('bgm');
        const toggleBlurBtn = document.getElementById('toggleBlurBtn');
        const modeBtn = document.getElementById('modeBtn');
        const cameraView = document.getElementById('cameraView');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        let isBlurred = false;
        let isManualActive = false;
        let aiLoaded = false;
        let isHighSensitivity = true;

        // 1. Inisialisasi Kamera Browser (Zero Latency)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    },
                    audio: false
                });
                video.srcObject = stream;
                
                // Mulai deteksi gestur
                startInstantGestureDetector();
                initMediaPipe();
            } catch (err) {
                console.error("Gagal membuka kamera:", err);
                statusText.innerText = "Izinkan akses kamera di browser";
                statusDot.style.backgroundColor = "#ef4444";
            }
        }

        // 2. Kontrol Efek Blur & Musik
        function setBlurState(active) {
            if (isBlurred === active) return;
            isBlurred = active;

            if (active) {
                video.classList.add('blurred');
                lyrics.classList.add('show');
                statusDot.classList.add('active');
                statusText.innerText = "✨ Foto Kita Blur (✌️ Aktif)";
                toggleBlurBtn.classList.add('active');
                
                // Putar Lagu seketika
                bgm.play().catch(e => {
                    console.log("Klik layar 1x agar browser mengizinkan audio.");
                });
                
                createHeart();
            } else {
                video.classList.remove('blurred');
                lyrics.classList.remove('show');
                statusDot.classList.remove('active');
                statusText.innerText = "Kamera Aktif • Angkat Pose ✌️ atau Tekan Spasi";
                toggleBlurBtn.classList.remove('active');
                
                // Hentikan Lagu
                bgm.pause();
                bgm.currentTime = 0;
            }
        }

        function createHeart() {
            if (!isBlurred) return;
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['🌸', '✨', '💖', '✌️', '💫'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = (Math.random() * 80 + 10) + '%';
            heart.style.bottom = '25%';
            cameraView.appendChild(heart);
            setTimeout(() => heart.remove(), 1800);
        }

        // 3. DETEKTOR GESTUR INSTAN (0.001 Detik / Zero Delay)
        // Bekerja langsung di canvas tanpa perlu nunggu loading CDN
        let prevPixels = null;
        function startInstantGestureDetector() {
            setInterval(() => {
                if (isManualActive || !video.videoWidth) return;

                // Jika MediaPipe sudah aktif mendeteksi, serahkan ke MediaPipe
                if (aiLoaded) return;

                // Analisis gestur tangan mendekat / mengangkat pose ke kamera
                ctx.drawImage(video, 0, 0, 160, 120);
                const frame = ctx.getImageData(0, 0, 160, 120);
                const data = frame.data;
                
                let skinPixels = 0;
                let topHalfSkin = 0;

                for (let i = 0; i < data.length; i += 16) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    // Deteksi warna kulit / telapak tangan & gestur di depan kamera
                    if (r > 60 && g > 40 && b > 20 && r > g && r > b && (r - g) > 10) {
                        skinPixels++;
                        const pixelIndex = i / 4;
                        const y = Math.floor(pixelIndex / 160);
                        if (y < 60) {
                            topHalfSkin++; // Bagian atas (tangan diangkat)
                        }
                    }
                }

                // Threshold gestur tangan diangkat
                const threshold = isHighSensitivity ? 65 : 120;
                if (topHalfSkin > threshold) {
                    setBlurState(true);
                } else {
                    setBlurState(false);
                }
            }, 60); // Cek setiap 60ms (sangat responsif & super ringan)
        }

        // 4. MediaPipe Hands (Deteksi Jari ✌️ yang Akurat & Fleksibel)
        function initMediaPipe() {
            if (typeof Hands === 'undefined') {
                return;
            }

            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.35, // Dibuat sangat sensitif agar tidak delay
                    minTrackingConfidence: 0.35
                });

                hands.onResults((results) => {
                    aiLoaded = true; // AI aktif
                    if (isManualActive) return;

                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const lm = results.multiHandLandmarks[0];
                        
                        // Jarak jari telunjuk (8) dan tengah (12) ke pergelangan tangan (0)
                        const wrist = lm[0];
                        const distIndex = Math.hypot(lm[8].x - wrist.x, lm[8].y - wrist.y);
                        const distMiddle = Math.hypot(lm[12].x - wrist.x, lm[12].y - wrist.y);
                        const distRing = Math.hypot(lm[16].x - wrist.x, lm[16].y - wrist.y);
                        const distPinky = Math.hypot(lm[20].x - wrist.x, lm[20].y - wrist.y);

                        // Cek apakah pose ✌️ (Telunjuk & tengah lebih panjang / tegak)
                        const isPeace = (distIndex > 0.25 && distMiddle > 0.25);
                        
                        if (isPeace) {
                            setBlurState(true);
                            return;
                        }
                    }
                    
                    if (!isManualActive) {
                        setBlurState(false);
                    }
                });

                const camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 480,
                    height: 360
                });
                camera.start();
            } catch(e) {
                console.log("Menggunakan Instant Fallback Gesture Detector.");
            }
        }

        // 5. KONTROL MANUAL (KLIK LAYAR, SPASI, TOMBOL)
        function toggleBlurManual() {
            isManualActive = !isManualActive;
            if (isManualActive) {
                setBlurState(true);
            } else {
                setBlurState(false);
            }
        }

        // Klik Tombol
        toggleBlurBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleBlurManual();
        });

        // Mode Sensitivitas
        modeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isHighSensitivity = !isHighSensitivity;
            document.getElementById('modeText').innerText = isHighSensitivity ? "Mode: Sensitif ✌️" : "Mode: Normal";
        });

        // Tekan SPASI di Keyboard (Instan 0ms)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleBlurManual();
            }
        });

        // Klik Layar Langsung
        cameraView.addEventListener('click', () => {
            toggleBlurManual();
        });

        // Mulai kamera saat pertama dimuat
        startCamera();
    </script>
</body>
</html>
